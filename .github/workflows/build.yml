name: Instaladores

on:
  workflow_dispatch:
  push:
    tags: ['v*']

# Necessário para o action-gh-release criar a Release com o GITHUB_TOKEN
permissions:
  contents: write

jobs:
  build:
    strategy:
      matrix:
        include:
          - os: windows-latest
            script: dist:win
            # latest.yml e o .blockmap são lidos pelo atualizador automático do Briar
            files: |
              release/*.exe
              release/*.exe.blockmap
              release/latest.yml
          - os: ubuntu-latest
            script: dist:linux
            files: |
              release/*.AppImage
              release/*.deb
              release/latest-linux.yml
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      # A versão do package.json é a que vai no instalador e no latest*.yml lido pelo atualizador:
      # se não bater com a tag, os clientes não enxergam a versão nova.
      - if: startsWith(github.ref, 'refs/tags/')
        run: node -e "const v=require('./package.json').version,t=process.env.GITHUB_REF_NAME;if(t!=='v'+v){console.error('Tag '+t+' nao bate com package.json ('+v+'). Rode npm version antes de criar a tag.');process.exit(1)}"
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm test
      - run: npm run ${{ matrix.script }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      - uses: actions/upload-artifact@v4
        with:
          name: briar-${{ matrix.os }}
          path: ${{ matrix.files }}
      - if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: ${{ matrix.files }}
